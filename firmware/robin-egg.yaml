# =============================================================================
# Robin Egg firmware
#
# The formatBCE reSpeaker XVF3800 firmware, pulled from GitHub at respeaker_ref,
# with Robin's own sounds. Build and flash with:
#
#   cd firmware && .venv/bin/esphome run robin-egg.yaml
#
# Needs a secrets.yaml next to this file. Copy secrets.yaml.example.
# =============================================================================

substitutions:
  # Same name as the factory firmware, so the egg keeps its network name
  # (respeaker-xvf3800-506da8.local) and the server finds it as before.
  name: respeaker-xvf3800
  friendly_name: Robin Egg

  # formatBCE release. It selects the packages, the C++ components and the
  # XMOS DSP firmware together.
  respeaker_ref: 2026.11.0

  # The listening, mute and unmute cues, made by tools/egg-sounds/make_sounds.py.
  wake_word_triggered_sound_file: sounds/wake_word_triggered.flac
  mute_switch_on_sound_file: sounds/mute_switch_on.flac
  mute_switch_off_sound_file: sounds/mute_switch_off.flac

  # The "Hey Robin" model in use: its round in wakeword/results/ and its cutoff.
  # Each wake clip carries both, so a clip can be traced to the model that heard it.
  hey_robin_round: v1
  hey_robin_cutoff: "0.9"

packages:
  respeaker:
    url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration
    ref: ${respeaker_ref}
    refresh: 1d
    files:
      - packages/base.yaml
      - packages/hardware.yaml
      - packages/voice-assistant.yaml
      - packages/leds.yaml
      - packages/timers-alarm.yaml

esphome:
  name_add_mac_suffix: true

# "Hey Robin", trained in wakeword/. Only the first model in the list is on at
# first boot, and a device file can only add to the end of the base firmware's
# list. So the base models are taken out and listed again after "Hey Robin".
# Keep them: the base firmware refers to each one by id.
micro_wake_word:
  models:
    - id: !remove okay_nabu
    - id: !remove kenobi
    - id: !remove hey_jarvis
    - id: !remove hey_mycroft
    - id: !remove stop
    - id: !remove snooze
    - model: hey_robin.json
      id: hey_robin
      # Trained at 0.97. Lowered because Ryan had to slow down to wake the egg.
      probability_cutoff: ${hey_robin_cutoff}
    - model: https://github.com/OHF-Voice/micro-wake-word/releases/download/okay_nabu_20241226.3/okay_nabu.json
      id: okay_nabu
    - model: https://raw.githubusercontent.com/formatBCE/Respeaker-Lite-ESPHome-integration/${satellite_core_ref}/microwakeword/models/v2/kenobi.json
      id: kenobi
    - model: hey_jarvis
      id: hey_jarvis
    - model: hey_mycroft
      id: hey_mycroft
    - model: https://github.com/OHF-Voice/micro-wake-word/releases/download/stop/stop.json
      id: stop
      internal: true
    - model: https://raw.githubusercontent.com/formatBCE/Respeaker-Lite-ESPHome-integration/${satellite_core_ref}/microwakeword/models/v2/snooze.json
      id: snooze
      internal: true
  # Runs after the base firmware's actions, so after its 300 ms wake sound delay when the
  # wake sound is on. Freezes the clip of the wake and tells the server it can fetch it.
  # Inside the same "mute switch is off" condition the base firmware uses, so a wake while
  # muted freezes nothing.
  on_wake_word_detected:
    - if:
        condition:
          switch.is_off: mic_mute_switch
        then:
          - wake_clip.freeze:
              id: wake_clip_capture
              wake_word: !lambda return wake_word;
          - homeassistant.event:
              event: esphome.wake_clip_frozen
              data:
                count: !lambda return to_string(id(wake_clip_capture).get_count());
                wake_word: !lambda return wake_word;

# Wake clips: the last 5 seconds of what the wake word model heard before each wake, frozen
# on the wake and served at http://<egg>:8080/wake-clip for the server to fetch. Removing
# this block, external_components and the on_wake_word_detected hook above gives back the
# firmware without clips.
external_components:
  - source:
      type: local
      path: components

wake_clip:
  id: wake_clip_capture
  # Must match micro_wake_word's microphone settings, so a clip is what the model heard.
  # The core package sets i2s_mics channel 1, and the XVF3800 package sets gain factor 1.
  microphone:
    microphone: i2s_mics
    channels: 1
    gain_factor: 1
  seconds: 5
  port: 8080
  model_round: ${hey_robin_round}
  cutoff: ${hey_robin_cutoff}

# Whether the board hears voices nearby, for the server to tell Robin someone is
# around. Only this on/off state leaves the egg: no audio and no direction.
# The DSP always reports a direction, and in a quiet room it holds the last one
# still. A voice moves it. The beam sensor publishes only when the direction
# moves to another LED, so each publish counts as a voice. The pending off is
# held for 10 s, and a new publish cancels it. The bench numbers are in
# docs/bench-test.md. While a wake word turn has the beam locked the direction
# barely moves, and the lock and unlock can each publish once, so the server
# ignores the state during a turn and for a while after.
respeaker_xvf3800:
  led_beam_sensor:
    on_value:
      - binary_sensor.template.publish:
          id: voice_heard
          state: ON
      - binary_sensor.template.publish:
          id: voice_heard
          state: OFF

binary_sensor:
  - platform: template
    name: "Voice Heard"
    id: voice_heard
    disabled_by_default: true
    filters:
      - delayed_off: 10s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# The API keeps the factory setup: encryption on, key set by the first client.
# The server and the bench script rely on that.

# No update password, like the factory firmware. Anyone on the local network
# can flash the egg.
ota:
  - platform: esphome
    id: ota_esphome

# Lets the web installer or a serial tool set Wi-Fi again over USB.
improv_serial:
